name: audit

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  audit:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - run: brew style trever/tap
      - run: brew audit --cask --online --tap trever/tap
