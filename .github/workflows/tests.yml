name: audit

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  audit:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - run: brew style trever/tap
      - run: brew audit --cask --online --tap trever/tap
